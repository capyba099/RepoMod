name: Release

on:
  push:
    branches:
      - main
    paths:
      - '**.cs'
      - '**.csproj'
      - 'manifest.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        run: echo "value=$(grep -oP '(?<=<Version>)[^<]+' RepoSpinTeleportMod.csproj | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release --no-restore false
        env:
          CI: true

      - name: Package release files
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p release
          cp "bin/Release/netstandard2.1/RepoSpinTeleportMod.dll" release/
          cp manifest.json release/
          cp BepInEx/plugins/SpinTeleportMod/README.md release/README.md
          cd release
          zip -r "../SpinTeleportMod-${VERSION}.zip" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v${VERSION}"
          TITLE="Spin Teleport Mod ${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "bin/Release/netstandard2.1/RepoSpinTeleportMod.dll" \
              "SpinTeleportMod-${VERSION}.zip" \
              --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "BepInEx-мод для R.E.P.O.: модель игрока крутится и телепортируется к другим игрокам каждую секунду.

          Установка:
          1. Установите BepInEx Pack для R.E.P.O.
          2. Скопируйте RepoSpinTeleportMod.dll в BepInEx/plugins/
          3. Запустите игру" \
              "bin/Release/netstandard2.1/RepoSpinTeleportMod.dll" \
              "SpinTeleportMod-${VERSION}.zip"
          fi
